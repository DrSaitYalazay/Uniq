# cy — nginx: statik SPA + cy-api proxy (aynı origin)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # V-4: keine Versionsnummer in Headern und auf Fehlerseiten (vorher
  # "nginx/1.31.6" in jeder Antwort und jeder 404-Seite).
  server_tokens off;
  # V-4: Zugriffe protokolliert Caddy — mit echter Client-IP und ohne die
  # Einmal-Token aus den Links. nginx sähe hier nur die interne Adresse von
  # Caddy und schriebe ?token=… ungefiltert ins Container-Log.
  access_log off;

  client_max_body_size 12m;

  # API uçlarını cy-api'ye yönlendir. Sadece alt yollar (/auth/…, /db/…) API'ye gider;
  # tam "/auth" SPA'nın giriş sayfasıdır (e-postalardaki login/reset bağlantıları buraya gelir).
  location ~ ^/(auth|db|storage|functions|realtime)/|^/health$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (realtime) için tamponlamayı kapat
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Gehashte Build-Assets (Vite: index-XXXX.js/.css) — der Dateiname ändert sich
  # bei jeder Änderung, daher dauerhaft cachebar ("immutable").
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA-Fallback. WICHTIG: index.html NIE cachen — sonst laden Browser nach einem
  # Deploy weiter die alte index.html, die auf das alte (gecachte) Bundle zeigt,
  # und die neue Version erscheint nie ("nichts geändert" trotz erfolgreichem Deploy).
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
