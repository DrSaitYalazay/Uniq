    <script>
      /* Pre-Paint: Dunkelmodus vor dem ersten Rendern setzen (kein Aufblitzen).
         Gleicher Schlüssel/gleiche Logik wie src/lib/themeMode.ts. */
      (function(){try{var m=localStorage.getItem("cws.theme.mode.v1")||"light";
      var d=m==="dark"||(m==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
      if(d){document.documentElement.classList.add("dark");document.documentElement.style.colorScheme="dark";}}catch(e){}})();
    </script>
